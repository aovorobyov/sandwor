<!doctype html>
<html data-theme="light">
  <head>
    <meta charset="utf-8" />
    <!-- PDF-материал A4 на токенах ДС. Данные — JSON в hash, собирает scripts/materials/build.mjs. -->
    <link rel="stylesheet" href="../../src/shared/sandwor/tokens/tokens.css" />
    <style>
      @font-face {
        font-family: 'Unbounded';
        src: url(../../src/shared/sandwor/fonts/Unbounded-Variable.woff2) format('woff2');
        font-weight: 600 700;
      }
      @font-face {
        font-family: 'Golos Text';
        src: url(../../src/shared/sandwor/fonts/GolosText-Variable.woff2) format('woff2');
        font-weight: 400 700;
      }
      @font-face {
        font-family: 'Fira Code';
        src: url(../../src/shared/sandwor/fonts/FiraCode-Variable.woff2) format('woff2');
        font-weight: 400 600;
      }
      @page {
        size: A4;
        margin: 14mm 0 18mm;
      }
      @page :first {
        margin-top: 0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body {
        width: 210mm;
        font: 400 10.5pt/1.45 var(--font-text);
        color: var(--text);
        background: var(--surface);
      }
      .cover {
        position: relative;
        padding: 16mm 18mm 14mm;
        color: var(--text);
        background:
          radial-gradient(circle at 92% 0%, var(--accent-soft), transparent 48%),
          radial-gradient(var(--dot) 1.1px, transparent 1.2px) 6px 6px / 14px 14px,
          var(--bg-canvas);
      }
      .cover .logo {
        display: block;
        height: 6.5mm;
      }
      .kicker {
        display: flex;
        gap: 2mm;
        align-items: center;
        margin-top: 12mm;
        font: 450 8.5pt/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent-text);
      }
      .kicker::before {
        content: '';
        width: 2mm;
        height: 2mm;
        border-radius: 50%;
        background: var(--accent);
      }
      h1 {
        margin-top: 4mm;
        font: 600 25pt/1.12 var(--font-display);
        letter-spacing: -0.02em;
        text-wrap: balance;
      }
      .lead {
        max-width: 150mm;
        margin-top: 5mm;
        font-size: 11pt;
        line-height: 1.5;
        color: var(--text-secondary);
      }
      .meta {
        display: flex;
        gap: 6mm;
        margin-top: 8mm;
        font: 450 8.5pt/1 var(--font-mono);
        color: var(--text-muted);
      }
      main {
        padding: 9mm 18mm 0;
      }
      section {
        margin-top: 7mm;
      }
      section:first-child {
        margin-top: 0;
      }
      h2 {
        padding-bottom: 2.5mm;
        border-bottom: 1.5px solid var(--text);
        font: 600 13pt/1.25 var(--font-display);
        letter-spacing: -0.01em;
        break-after: avoid;
      }
      .item {
        display: grid;
        grid-template-columns: 5mm 7mm 1fr;
        gap: 0 3mm;
        padding: 3.2mm 0;
        border-bottom: 1px solid var(--line);
        break-inside: avoid;
      }
      .box {
        width: 4.4mm;
        height: 4.4mm;
        margin-top: 0.6mm;
        border: 1.3px solid var(--line-control);
        border-radius: 1mm;
      }
      /* Номер пункта — обычной цифрой на линии заголовка пункта, без ведущего нуля. */
      .num {
        font: 600 10.5pt/1.4 var(--font-text);
        font-variant-numeric: tabular-nums;
        color: var(--text-muted);
      }
      .item b {
        display: block;
        font-size: 10.5pt;
        font-weight: 600;
        line-height: 1.4;
      }
      .item p {
        margin-top: 0.8mm;
        font-size: 9.5pt;
        line-height: 1.45;
        color: var(--text-secondary);
      }
      .note {
        margin-top: 7mm;
        padding: 4mm 5mm;
        font-size: 9.5pt;
        line-height: 1.5;
        color: var(--text-secondary);
        background: var(--accent-soft);
        border-left: 1.2mm solid var(--accent);
        border-radius: 1.5mm;
        break-inside: avoid;
      }
      .cta {
        display: flex;
        gap: 5mm;
        align-items: center;
        justify-content: space-between;
        margin-top: 6mm;
        padding: 5mm 6mm;
        color: var(--text);
        background: var(--bg-canvas);
        border-radius: 2mm;
        break-inside: avoid;
      }
      .cta p {
        font-size: 10pt;
        line-height: 1.45;
        color: var(--text-secondary);
      }
      .cta .logo {
        flex: none;
        height: 5mm;
      }
    </style>
  </head>
  <body>
    <script type="module">
      const d = JSON.parse(decodeURIComponent(location.hash.slice(1)));
      const esc = (t = '') =>
        String(t).replace(
          /[&<>"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
        );
      let n = 0;
      const total = d.sections.reduce((sum, s) => sum + s.items.length, 0);

      document.body.innerHTML = `
        <header class="cover" data-theme="dark">
          <img class="logo" src="../../src/shared/sandwor/logo/sandwor-wordmark-on-dark.svg" alt="sandwor">
          <div class="kicker">${esc(d.kicker)}</div>
          <h1>${esc(d.title)}</h1>
          <p class="lead">${esc(d.lead)}</p>
          <div class="meta"><span>${total} ${esc(d.pointsLabel)}</span><span>sandwor.ru</span><span>${esc(d.edition)}</span></div>
        </header>
        <main>
          ${d.sections
            .map(
              (s) => `<section>
                <h2>${esc(s.title)}</h2>
                ${s.items
                  .map(([title, text]) => {
                    n += 1;
                    return `<div class="item"><i class="box"></i><span class="num">${n}</span><div><b>${esc(title)}</b><p>${esc(text)}</p></div></div>`;
                  })
                  .join('')}
              </section>`,
            )
            .join('')}
          <div class="note">${esc(d.note)}</div>
          <div class="cta" data-theme="dark"><p>${esc(d.cta)}</p><img class="logo" src="../../src/shared/sandwor/logo/sandwor-wordmark-on-dark.svg" alt=""></div>
        </main>`;
      await document.fonts.ready;
      await Promise.all(
        [...document.images].map((im) =>
          im.complete ? 0 : new Promise((r) => (im.onload = im.onerror = r)),
        ),
      );
      document.body.dataset.ready = '1';
    </script>
  </body>
</html>
