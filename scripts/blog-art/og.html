<!doctype html>
<html data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!--
      OG-картинки 1200×630 на токенах дизайн-системы. Данные — JSON в hash адреса,
      их собирает scripts/blog-art/og.mjs из живых страниц сайта.
    -->
    <link rel="stylesheet" href="../../src/shared/sandwor/tokens/tokens.css" />
    <style>
      @font-face {
        font-family: 'Unbounded';
        src: url(../../src/shared/sandwor/fonts/Unbounded-Variable.woff2) format('woff2');
        font-weight: 600 700;
      }
      @font-face {
        font-family: 'Golos Text';
        src: url(../../src/shared/sandwor/fonts/GolosText-Variable.woff2) format('woff2');
        font-weight: 400 700;
      }
      @font-face {
        font-family: 'Fira Code';
        src: url(../../src/shared/sandwor/fonts/FiraCode-Variable.woff2) format('woff2');
        font-weight: 400 600;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: var(--font-text);
        color: var(--text);
        background:
          radial-gradient(circle at 88% 0%, var(--accent-soft), transparent 46%),
          radial-gradient(var(--dot) 1.2px, transparent 1.3px) 8px 8px / 16px 16px,
          var(--bg-canvas);
      }
      .text {
        position: absolute;
        left: 72px;
        top: 64px;
        bottom: 64px;
        width: 600px;
        display: flex;
        flex-direction: column;
      }
      .logo {
        height: 26px;
        width: auto;
        align-self: flex-start;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: auto;
        font: 450 16px/20px var(--font-mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent-text);
      }
      .tag::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
      }
      .title {
        margin-top: 20px;
        font: 600 50px/56px var(--font-display);
        letter-spacing: -0.025em;
        text-wrap: balance;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .title.l {
        font-size: 54px;
        line-height: 58px;
      }
      .lead {
        margin-top: 20px;
        font: 400 22px/31px var(--font-text);
        color: var(--text-secondary);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .meta {
        display: flex;
        gap: 14px;
        align-items: center;
        margin-top: 28px;
        font: 450 16px/20px var(--font-mono);
        color: var(--text-muted);
      }
      .meta i {
        width: 32px;
        height: 4px;
        border-radius: 2px;
        background: var(--accent);
      }
      .art {
        position: absolute;
        top: 64px;
        bottom: 64px;
        left: 720px;
        right: -80px;
      }
      .card {
        position: absolute;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 14px;
        box-shadow: var(--shadow-overlay);
      }
      .card img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
      }
      .browser .bar {
        display: flex;
        gap: 7px;
        align-items: center;
        height: 34px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        background: var(--surface-raised);
        font: 450 13px/1 var(--font-mono);
        color: var(--text-muted);
      }
      .browser .bar b {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--line-control);
      }
      .browser .bar span {
        margin-left: 10px;
      }
      .browser img {
        height: calc(100% - 34px);
      }
      .phone {
        padding: 8px;
        border-radius: 30px;
        background: var(--surface-raised-2);
      }
      .phone img {
        border-radius: 22px;
      }
      .lead-card {
        position: absolute;
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 14px 20px 14px 14px;
        background: var(--surface-overlay);
        border: 1px solid var(--line-strong);
        border-radius: 16px;
        box-shadow: var(--shadow-overlay);
      }
      .lead-card .ico {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: var(--accent-soft);
        color: var(--accent);
      }
      .lead-card b {
        display: block;
        font: 600 17px/22px var(--font-text);
      }
      .lead-card small {
        font: 400 15px/20px var(--font-text);
        color: var(--text-secondary);
      }
      .plans {
        padding: 26px 30px;
      }
      .plans p {
        font: 450 14px/18px var(--font-mono);
        color: var(--text-muted);
        margin-bottom: 10px;
      }
      .plan {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        padding: 18px 0;
        border-top: 1px solid var(--line);
      }
      .plan b {
        display: block;
        font: 600 20px/26px var(--font-display);
      }
      .plan small {
        font: 400 15px/20px var(--font-text);
        color: var(--text-muted);
      }
      .plan em {
        font: 450 19px/24px var(--font-mono);
        font-style: normal;
        color: var(--text-secondary);
        white-space: nowrap;
      }
      .plan.on em {
        color: var(--accent-text);
      }
      .channels {
        padding: 22px 26px;
      }
      .channel {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 14px 0;
        border-top: 1px solid var(--line);
      }
      .channel:first-child {
        border-top: 0;
      }
      .channel .ico {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: var(--surface-raised);
        border: 1px solid var(--line);
        color: var(--text);
      }
      .channel small {
        display: block;
        font: 400 14px/18px var(--font-text);
        color: var(--text-muted);
      }
      .channel b {
        font: 450 19px/24px var(--font-mono);
        font-weight: 450;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { ICONS } from '../../src/shared/sandwor/src/icons.js';
      const d = JSON.parse(decodeURIComponent(location.hash.slice(1)));
      const icon = (n, size = 22) =>
        `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
      const esc = (t = '') =>
        String(t).replace(
          /[&<>"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
        );
      const browser = (src, domain, style) =>
        `<div class="card browser" style="${style}"><div class="bar"><b></b><b></b><b></b><span>${esc(domain)}</span></div><img src="${src}"></div>`;
      const phone = (src, style) =>
        `<div class="card phone" style="${style}"><img src="${src}"></div>`;

      const text = `<div class="text" style="${d.big ? 'width:540px' : ''}">
        <img class="logo" src="../../src/shared/sandwor/logo/sandwor-wordmark-on-dark.svg" alt="">
        ${d.tag ? `<span class="tag">${esc(d.tag)}</span>` : '<span class="tag" style="visibility:hidden">.</span>'}
        <h1 class="title ${d.big ? 'l' : ''}">${esc(d.title)}</h1>
        ${d.lead ? `<p class="lead">${esc(d.lead)}</p>` : ''}
        ${d.meta ? `<div class="meta"><i></i>${esc(d.meta)}</div>` : ''}
      </div>`;

      let art = '';
      const A = d.art || {};
      if (A.type === 'cover') {
        art = `<div class="card" style="left:0;top:20px;width:620px;height:430px">${`<img src="${A.src}">`}</div>`;
      }
      if (A.type === 'image') {
        art = `<img src="${A.src}" style="position:absolute;left:-100px;top:-10px;width:540px;height:auto">`;
      }
      if (A.type === 'site') {
        art =
          browser(A.desktop, A.domain, 'left:40px;top:40px;width:640px;height:400px') +
          phone(A.mobile, 'left:0;top:170px;width:150px;height:300px') +
          (A.leadTitle
            ? `<div class="lead-card" style="left:-30px;top:0"><span class="ico">${icon('inbox', 22)}</span><span><b>${esc(A.leadTitle)}</b><small>${esc(A.leadText)}</small></span></div>`
            : '');
      }
      if (A.type === 'two-sites') {
        art =
          browser(
            A.items[1].desktop,
            A.items[1].domain,
            'left:120px;top:0;width:560px;height:330px;opacity:.9',
          ) +
          browser(
            A.items[0].desktop,
            A.items[0].domain,
            'left:0;top:150px;width:580px;height:350px',
          );
      }
      if (A.type === 'covers') {
        art = A.items
          .map(
            (src, i) =>
              `<div class="card" style="left:${i * 70}px;top:${i * 70}px;width:470px;height:310px;transform:rotate(${(i - 1) * 3}deg)"><img src="${src}"></div>`,
          )
          .join('');
      }
      if (A.type === 'plans') {
        art = `<div class="card plans" style="left:0;top:0;width:480px">
          <p>${esc(A.head)}</p>
          ${A.items.map((p, i) => `<div class="plan ${i === 0 ? 'on' : ''}"><span><b>${esc(p.name)}</b><small>${esc(p.sub)}</small></span><em>${esc(p.price)}</em></div>`).join('')}
        </div>`;
      }
      if (A.type === 'channels') {
        art = `<div class="card channels" style="left:0;top:20px;width:430px">
          ${A.items.map((c) => `<div class="channel"><span class="ico">${icon(c.icon, 24)}</span><span><small>${esc(c.label)}</small><b>${esc(c.value)}</b></span></div>`).join('')}
        </div>`;
      }

      document.body.innerHTML = text + `<div class="art">${art}</div>`;
      await document.fonts.ready;
      await Promise.all(
        [...document.images].map((im) =>
          im.complete ? 0 : new Promise((r) => (im.onload = im.onerror = r)),
        ),
      );
      document.body.dataset.ready = '1';
    </script>
  </body>
</html>
