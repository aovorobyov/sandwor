name: CI

on:
  push:
    branches: [main]
  pull_request:

# Отменяем устаревшие запуски на той же ветке/PR — экономит минуты.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Husky не нужен в CI — хуки локальные, а prepare-скрипт впустую дёргает диск.
  HUSKY: 0

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run size
