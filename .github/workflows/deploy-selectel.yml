name: Deploy sandwor.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Upload build
        run: |
          SSH="ssh -i ~/.ssh/id_ed25519"
          TARGET=deploy@${{ secrets.HOST }}:/var/www/sandwor.ru
          rsync -az --delete \
            --exclude='.env.production' \
            -e "$SSH" .next/standalone/ $TARGET/
          rsync -az --delete -e "$SSH" .next/static/ $TARGET/.next/static/
          rsync -az --delete -e "$SSH" public/ $TARGET/public/

      - name: Restart
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.HOST }} \
            "sudo systemctl restart sandwor"
